spring.application.name=orders-outbox-demo

spring.datasource.url=jdbc:h2:file:./data/ordersdb;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=

chaos.crash-after-send=false
chaos.crash-mid-handle=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.sql.init.mode=always
logging.level.org.springframework.jdbc.datasource.init=DEBUG
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=6000

spring.kafka.consumer.group-id=shipping-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
